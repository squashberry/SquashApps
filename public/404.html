<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SquashApps</title>
<script>
(function(){
  var base='/SquashApps';
  var path=location.pathname.replace(base,'')||'/';
  var query=location.search||'';
  var hash=location.hash||'';
  if(path!== '/' && !query.includes('__route=')){
    location.replace(base+'/?__route='+encodeURIComponent(path+query+hash));
  }
})();
</script>
</head>
<body></body>
</html>
